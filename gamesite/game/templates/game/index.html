<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save Him! - Guess the Number</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --font: 'Press Start 2P', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 12px 60px;
            min-height: 100vh;
            font-family: var(--font);
            font-size: 12px;
            line-height: 1.7;
            color: #fff;
            /* dirt-block background */
            background:
                linear-gradient(90deg, rgba(0, 0, 0, .2) 50%, transparent 0) 0 0 / 32px 32px,
                linear-gradient(rgba(0, 0, 0, .2) 50%, transparent 0) 0 0 / 32px 32px,
                #5b3a1e;
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        .title {
            text-align: center;
            color: #ffe94d;
            font-size: clamp(18px, 5vw, 30px);
            line-height: 1.4;
            margin: 0 0 18px;
            text-shadow: 4px 4px 0 #000;
        }

        .title small {
            display: block;
            margin-top: 8px;
            font-size: 10px;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        /* ================= STAGE (the scenery) ================= */
        .stage {
            --drop: 0px;
            /* how far the guy has been lowered */
            position: relative;
            height: 440px;
            overflow: hidden;
            border: 4px solid #000;
            box-shadow: 0 0 0 4px #3b3b3b, 8px 8px 0 4px rgba(0, 0, 0, .4);
            background: linear-gradient(#58a8ff 0%, #9fd6ff 50%, #d9f1ff 100%);
        }

        .stage.hit {
            animation: hit .3s;
        }

        @keyframes hit {

            0%,
            100% {
                transform: none;
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .sun {
            position: absolute;
            top: 28px;
            right: 44px;
            width: 48px;
            height: 48px;
            background: #ffe94d;
            box-shadow: 0 0 0 8px rgba(255, 233, 77, .35), 0 0 0 16px rgba(255, 233, 77, .18);
        }

        .cloud {
            position: absolute;
            left: 0;
            width: 72px;
            height: 20px;
            background: #fff;
            opacity: .95;
            animation: drift linear infinite;
        }

        .cloud::before {
            content: "";
            position: absolute;
            left: 14px;
            top: -14px;
            width: 36px;
            height: 14px;
            background: #fff;
        }

        @keyframes drift {
            from {
                transform: translateX(-120px);
            }

            to {
                transform: translateX(840px);
            }
        }

        .hills {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 56px;
        }

        .hills.far {
            height: 170px;
            background: #8ccbb4;
            clip-path: polygon(0 100%, 0 55%, 10% 55%, 10% 35%, 22% 35%, 22% 15%, 34% 15%, 34% 40%, 48% 40%, 48% 60%, 60% 60%, 60% 30%, 74% 30%, 74% 10%, 86% 10%, 86% 45%, 100% 45%, 100% 100%);
        }

        .hills.near {
            height: 110px;
            background: #4a9a38;
            clip-path: polygon(0 100%, 0 60%, 8% 60%, 8% 40%, 18% 40%, 18% 20%, 30% 20%, 30% 45%, 42% 45%, 42% 65%, 55% 65%, 55% 35%, 66% 35%, 66% 15%, 78% 15%, 78% 40%, 90% 40%, 90% 55%, 100% 55%, 100% 100%);
        }

        .tree {
            position: absolute;
            bottom: 52px;
            width: 64px;
            height: 132px;
        }

        .tree.small {
            transform: scale(.75);
            transform-origin: bottom center;
        }

        .tree::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 64px;
            height: 64px;
            border: 3px solid #1d5a1d;
            background: linear-gradient(90deg, rgba(0, 0, 0, .16) 50%, transparent 0) 0 0 / 16px 16px,
                linear-gradient(rgba(0, 0, 0, .16) 50%, transparent 0) 0 0 / 16px 16px, #35a035;
        }

        .tree::after {
            content: "";
            position: absolute;
            left: 24px;
            top: 64px;
            width: 16px;
            height: 68px;
            border: 2px solid #3a2410;
            background: repeating-linear-gradient(0deg, #6b4423 0 8px, #5a3a1c 8px 10px);
        }

        .ground {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 56px;
            background: linear-gradient(90deg, rgba(0, 0, 0, .13) 50%, transparent 0) 0 0 / 24px 24px,
                linear-gradient(rgba(0, 0, 0, .13) 50%, transparent 0) 0 0 / 24px 24px, #8a5a2b;
        }

        .ground::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 16px;
            border-bottom: 4px solid #3f8f28;
            background: linear-gradient(90deg, rgba(0, 0, 0, .12) 50%, transparent 0) 0 0 / 24px 16px, #5fbf3a;
        }

        /* gallows */
        .wood {
            background: repeating-linear-gradient(90deg, #9a6a35 0 14px, #86582a 14px 16px);
            border: 2px solid #4a2d12;
        }

        .beam {
            position: absolute;
            top: 22px;
            left: calc(50% - 150px);
            width: 190px;
            height: 16px;
        }

        .post {
            position: absolute;
            top: 22px;
            left: calc(50% - 150px);
            width: 18px;
            bottom: 52px;
        }

        /* hearts HUD */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 7;
            display: flex;
            gap: 4px;
            filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, .45));
        }

        .heart {
            width: 34px;
            height: 34px;
        }

        .heart svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .heart.pop {
            animation: heartPop .45s;
        }

        @keyframes heartPop {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.6) rotate(-12deg);
                filter: brightness(2.5);
            }

            60% {
                transform: scale(1.3) rotate(10deg);
            }

            100% {
                transform: scale(1);
            }
        }

        /* everything above the shredder is clipped, so he vanishes INTO the slot */
        .clip {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 290px;
            overflow: hidden;
            z-index: 3;
        }

        .rope {
            position: absolute;
            left: calc(50% - 2px);
            top: 38px;
            width: 4px;
            height: calc(28px + var(--drop));
            background: repeating-linear-gradient(#cfae72 0 4px, #8a6a3b 4px 6px);
            transition: height .7s cubic-bezier(.3, 1.4, .5, 1);
        }

        .person {
            position: absolute;
            left: calc(50% - 30px);
            top: calc(66px + var(--drop));
            width: 60px;
            height: 116px;
            transition: top .7s cubic-bezier(.3, 1.4, .5, 1);
        }

        .swing {
            position: relative;
            width: 60px;
            height: 116px;
            transform-origin: 50% 0;
            animation: swing var(--sd, 3s) ease-in-out infinite;
        }

        @keyframes swing {

            0%,
            100% {
                transform: rotate(calc(var(--a, 3deg) * -1));
            }

            50% {
                transform: rotate(var(--a, 3deg));
            }
        }

        .person.calm {
            --a: 3deg;
            --sd: 3s;
        }

        .person.worried {
            --a: 5deg;
            --sd: 1.6s;
            --wave: 70deg;
            --wd: .8s;
        }

        .person.panic {
            --a: 8deg;
            --sd: .45s;
            --wave: 150deg;
            --wd: .3s;
        }

        .person.happy {
            --a: 0deg;
        }

        .part {
            position: absolute;
            overflow: hidden;
            border: 2px solid #000;
            font-family: var(--font);
            font-size: 7px;
            line-height: 8px;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .head {
            left: 14px;
            top: 0;
            width: 32px;
            height: 32px;
            background: #c98d5c;
        }

        .torso {
            left: 12px;
            top: 32px;
            width: 36px;
            height: 44px;
            background: #14a8a8;
            color: rgba(255, 255, 255, .55);
        }

        .arm {
            top: 32px;
            width: 12px;
            height: 40px;
            background: #c98d5c;
            color: rgba(70, 25, 0, .6);
            transform-origin: 50% 2px;
        }

        .arm.l {
            left: 0;
            transform: rotate(8deg);
        }

        .arm.r {
            left: 48px;
            transform: rotate(-8deg);
        }

        .leg {
            top: 76px;
            width: 18px;
            height: 40px;
            background: #3b3fa0;
            color: rgba(255, 255, 255, .45);
            transform-origin: 50% 0;
        }

        .leg.l {
            left: 12px;
        }

        .leg.r {
            left: 30px;
        }

        .hair {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            height: 10px;
            background: #3b2412;
        }

        .eye {
            position: absolute;
            top: 12px;
            width: 8px;
            height: 8px;
            background: #fff;
            border: 1px solid #000;
        }

        .eye.l {
            left: 5px;
        }

        .eye.r {
            left: 17px;
        }

        .eye::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 2px;
            width: 3px;
            height: 3px;
            background: #1d3bff;
        }

        .mouth {
            position: absolute;
            left: 9px;
            top: 22px;
            width: 10px;
            height: 3px;
            background: #3a0f0f;
        }

        .person.worried .mouth {
            top: 21px;
            width: 8px;
            height: 5px;
            left: 10px;
        }

        .person.panic .eye {
            width: 10px;
            height: 11px;
            top: 9px;
        }

        .person.panic .eye.l {
            left: 4px;
        }

        .person.panic .eye.r {
            left: 16px;
        }

        .person.panic .mouth {
            left: 8px;
            top: 20px;
            width: 12px;
            height: 8px;
        }

        .person.happy .mouth {
            background: transparent;
            border: 3px solid #3a0f0f;
            border-top: 0;
            left: 8px;
            top: 19px;
            width: 12px;
            height: 6px;
        }

        .person.worried .arm.l,
        .person.panic .arm.l {
            animation: waveL var(--wd) ease-in-out infinite alternate;
        }

        .person.worried .arm.r,
        .person.panic .arm.r {
            animation: waveR var(--wd) ease-in-out infinite alternate;
        }

        @keyframes waveL {
            from {
                transform: rotate(15deg);
            }

            to {
                transform: rotate(var(--wave));
            }
        }

        @keyframes waveR {
            from {
                transform: rotate(-15deg);
            }

            to {
                transform: rotate(calc(var(--wave) * -1));
            }
        }

        .person.panic .leg.l {
            animation: kickL .3s ease-in-out infinite alternate;
        }

        .person.panic .leg.r {
            animation: kickR .3s ease-in-out infinite alternate;
        }

        @keyframes kickL {
            from {
                transform: rotate(-16deg);
            }

            to {
                transform: rotate(16deg);
            }
        }

        @keyframes kickR {
            from {
                transform: rotate(16deg);
            }

            to {
                transform: rotate(-16deg);
            }
        }

        .person.happy .arm.l {
            transform: rotate(160deg);
        }

        .person.happy .arm.r {
            transform: rotate(-160deg);
        }

        .person.happy .swing {
            animation: hop .45s ease-in-out infinite alternate;
        }

        @keyframes hop {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-9px);
            }
        }

        .sweat {
            position: absolute;
            left: 46px;
            top: 6px;
            width: 6px;
            height: 9px;
            background: #4cc3ff;
            border: 1px solid #1b7fb0;
            display: none;
            animation: sweat .8s linear infinite;
        }

        .person.worried .sweat,
        .person.panic .sweat {
            display: block;
        }

        @keyframes sweat {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(18px);
                opacity: 0;
            }
        }

        /* the guy's speech bubble */
        .bubble {
            position: absolute;
            z-index: 4;
            left: calc(50% + 50px);
            top: calc(58px + var(--drop));
            width: min(210px, calc(50% - 62px));
            padding: 9px 10px;
            background: #fff;
            color: #111;
            border: 3px solid #000;
            font-size: 9px;
            line-height: 1.6;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, .3);
            transform-origin: 0 20px;
            transition: top .7s cubic-bezier(.3, 1.4, .5, 1), opacity .2s;
        }

        .bubble::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 12px;
            width: 12px;
            height: 12px;
            background: #fff;
            border-left: 3px solid #000;
            border-bottom: 3px solid #000;
            transform: rotate(45deg);
        }

        .bubble.pop {
            animation: bpop .3s;
        }

        .bubble.hidden {
            opacity: 0;
        }

        @keyframes bpop {
            0% {
                transform: scale(.7);
            }

            60% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        /* shredder */
        .shredder {
            position: absolute;
            left: calc(50% - 115px);
            bottom: 44px;
            width: 230px;
            height: 106px;
            z-index: 5;
        }

        .cap {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 28px;
            border: 3px solid #000;
            background: linear-gradient(#aab2bb, #79818b);
        }

        .slot {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 6px;
            height: 11px;
            border: 2px solid #000;
            background: repeating-linear-gradient(90deg, #111 0 8px, #5a5a5a 8px 12px);
            animation: gears .7s linear infinite;
        }

        @keyframes gears {
            to {
                background-position: 12px 0;
            }
        }

        .machine {
            position: absolute;
            left: 8px;
            right: 8px;
            top: 28px;
            bottom: 0;
            border: 3px solid #000;
            border-top: 0;
            background: linear-gradient(90deg, #69707a, #929aa5 45%, #69707a);
        }

        .label {
            position: absolute;
            left: 0;
            right: 0;
            top: 10px;
            text-align: center;
            font-size: 10px;
            text-shadow: 2px 2px 0 #000;
        }

        .led {
            position: absolute;
            right: 10px;
            top: 34px;
            width: 10px;
            height: 10px;
            background: #2cff5a;
            box-shadow: 0 0 8px #2cff5a;
        }

        .hazard {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            height: 14px;
            border: 2px solid #000;
            background: repeating-linear-gradient(135deg, #ffd400 0 10px, #111 10px 20px);
        }

        .stage.danger .led {
            background: #ff2c2c;
            box-shadow: 0 0 10px #ff2c2c;
            animation: blink .5s steps(2) infinite;
        }

        @keyframes blink {
            50% {
                opacity: .2;
            }
        }

        .shredder.run {
            animation: shake .09s linear infinite;
        }

        .shredder.run .slot {
            animation-duration: .08s;
        }

        @keyframes shake {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(-3px, 1px);
            }

            50% {
                transform: translate(3px, -1px);
            }

            75% {
                transform: translate(-2px, -1px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* falling = rope snaps, he drops in */
        .stage.falling .rope {
            height: 28px;
            transition: none;
        }

        .stage.falling .person {
            transition: top .8s cubic-bezier(.5, 0, 1, .5);
        }

        .stage.reset .person,
        .stage.reset .rope,
        .stage.reset .bubble {
            transition: none !important;
        }

        /* flying numbers and symbols */
        .bit {
            position: absolute;
            z-index: 9;
            pointer-events: none;
            font-family: var(--font);
            text-shadow: 2px 2px 0 #000;
            animation: bit var(--dur, 1.2s) forwards;
        }

        @keyframes bit {
            0% {
                transform: translate(0, 0) rotate(0) scale(.5);
                opacity: 1;
                animation-timing-function: ease-out;
            }

            40% {
                transform: translate(calc(var(--dx) * .7), var(--dy)) rotate(calc(var(--rot) * .5)) scale(1.2);
                opacity: 1;
                animation-timing-function: ease-in;
            }

            100% {
                transform: translate(var(--dx), calc(var(--dy) + 300px)) rotate(var(--rot)) scale(.8);
                opacity: 0;
            }
        }

        /* win / game over banner */
        .banner {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            background: rgba(0, 0, 0, .45);
            pointer-events: none;
        }

        .banner.show {
            display: flex;
            animation: fadeIn .5s;
        }

        .banner.win .b-title {
            color: #4cff7a;
        }

        .banner.lose .b-title {
            color: #ff4a4a;
        }

        .b-title {
            font-size: clamp(20px, 6vw, 36px);
            text-shadow: 4px 4px 0 #000;
        }

        .b-sub {
            font-size: 12px;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ================= MINECRAFT-STYLE UI PANELS ================= */
        .panel {
            margin-top: 20px;
            padding: 22px 18px;
            text-align: center;
            color: #2b2b2b;
            line-height: 1.9;
            background: #c6c6c6;
            border: 4px solid #000;
            box-shadow: inset 4px 4px 0 #fff, inset -4px -4px 0 #7b7b7b, 8px 8px 0 rgba(0, 0, 0, .35);
        }

        .panel h2 {
            margin: 0 0 12px;
            font-size: 16px;
        }

        .panel p {
            margin: 10px 0;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .mc-btn {
            font-family: var(--font);
            font-size: 12px;
            color: #fff;
            text-shadow: 2px 2px 0 #3e3e3e;
            background: #7d7d7d;
            border: 3px solid #000;
            padding: 12px 16px;
            cursor: pointer;
            box-shadow: inset 3px 3px 0 #b8b8b8, inset -3px -3px 0 #4f4f4f;
        }

        .mc-btn:hover {
            background: #7e8fe0;
        }

        .mc-btn:active {
            box-shadow: inset 3px 3px 0 #4f4f4f, inset -3px -3px 0 #b8b8b8;
        }

        .mc-btn.green {
            background: #4c9a2a;
        }

        .mc-btn.green:hover {
            background: #5fbf3a;
        }

        .mc-btn.small {
            font-size: 10px;
            padding: 8px 12px;
        }

        .mc-input {
            font-family: var(--font);
            font-size: 16px;
            color: #fff;
            background: #000;
            outline: none;
            border: 3px solid #8b8b8b;
            padding: 12px;
            text-align: center;
            width: 150px;
            -moz-appearance: textfield;
        }

        .mc-input::-webkit-inner-spin-button,
        .mc-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
        }

        .mc-input:focus {
            border-color: #fff;
        }

        .mc-input.wide {
            width: min(280px, 100%);
        }

        .range {
            font-size: 10px;
            margin: 6px 0;
        }

        .msg {
            font-size: 12px;
            min-height: 22px;
            margin: 10px 0;
        }

        .error {
            color: #b00020;
            font-size: 10px;
            min-height: 16px;
        }

        .lb {
            list-style: none;
            margin: 0 0 14px;
            padding: 0;
            text-align: left;
        }

        .lb li {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
            padding: 8px 10px;
            font-size: 11px;
            color: #fff;
            background: #8b8b8b;
            border: 3px solid #000;
            text-shadow: 2px 2px 0 #3e3e3e;
        }

        .lb li:nth-child(1) {
            background: #c9a227;
        }

        .lb li:nth-child(2) {
            background: #9ea7b0;
        }

        .lb li:nth-child(3) {
            background: #a8693a;
        }

        .lb .rank {
            width: 34px;
        }

        .lb .nm {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="wrap">

        <h1 class="title">SAVE HIM!<small>Guess the number from 1 to 100</small></h1>

        <!-- ============ THE SCENE (always visible) ============ -->
        <div class="stage" id="stage">
            <div class="sun"></div>
            <div class="cloud" style="top:36px;  animation-duration:80s;  animation-delay:-10s"></div>
            <div class="cloud" style="top:84px;  animation-duration:110s; animation-delay:-70s; width:56px"></div>
            <div class="cloud" style="top:56px;  animation-duration:95s;  animation-delay:-40s; width:88px"></div>
            <div class="hills far"></div>
            <div class="hills near"></div>
            <div class="tree" style="left:22px"></div>
            <div class="tree small" style="right:30px"></div>
            <div class="ground"></div>

            <div class="post wood"></div>
            <div class="beam wood"></div>

            <div class="hud" id="hearts"></div>

            <div class="clip">
                <div class="rope"></div>
                <div class="person calm" id="person">
                    <div class="swing">
                        <div class="part arm l num"></div>
                        <div class="part arm r num"></div>
                        <div class="part leg l num"></div>
                        <div class="part leg r num"></div>
                        <div class="part torso num"></div>
                        <div class="part head"><i class="hair"></i><i class="eye l"></i><i class="eye r"></i><i
                                class="mouth"></i></div>
                        <div class="sweat"></div>
                    </div>
                </div>
                <div class="bubble" id="bubble"></div>
            </div>

            <div class="shredder" id="shredder">
                <div class="cap">
                    <div class="slot"></div>
                </div>
                <div class="machine"><span class="label">SHREDDER</span><i class="led"></i>
                    <div class="hazard"></div>
                </div>
            </div>

            <div class="banner" id="banner">
                <div class="b-title" id="b-title"></div>
                <div class="b-sub" id="b-sub"></div>
            </div>
        </div>

        <!-- ============ NAME ============ -->
        <div id="name" class="panel screen">
            <h2>WELCOME!</h2>
            <p>Enter your name, hero.</p>
            <input type="text" id="name-input" class="mc-input wide" maxlength="20" placeholder="Your name">
            <p><button class="mc-btn green" onclick="saveName()">CONTINUE</button></p>
            <p id="name-error" class="error"></p>
        </div>

        <!-- ============ HOME ============ -->
        <div id="home" class="panel screen">
            <h2>Hi, <span id="player-name"></span>!</h2>
            <p>He is hanging over a shredder.<br>You have 5 hearts. Every wrong guess lowers him closer!</p>
            <p><button class="mc-btn green" onclick="startGame()">START GAME</button></p>
            <p>
                <button class="mc-btn small" onclick="showLeaderboard()">LEADERBOARD</button>
                <button class="mc-btn small" onclick="show('name')">CHANGE NAME</button>
            </p>
        </div>

        <!-- ============ PLAY ============ -->
        <div id="play" class="panel screen">
            <p>Player: <b class="pname"></b> &nbsp; Guesses: <b id="attempts">0</b></p>
            <p class="range" id="range"></p>
            <h3 class="msg" id="message"></h3>

            <div id="guess-form">
                <input type="number" id="guess" class="mc-input" min="1" max="100" placeholder="1-100">
                <button class="mc-btn green" onclick="submitGuess()">GUESS</button>
            </div>
            <div id="end-buttons" style="display:none">
                <button class="mc-btn green" onclick="startGame()">PLAY AGAIN</button>
            </div>
            <p><button class="mc-btn small" onclick="show('home')">HOME</button></p>
        </div>

        <!-- ============ LEADERBOARD ============ -->
        <div id="leaderboard" class="panel screen">
            <h2>HALL OF HEROES</h2>
            <ul class="lb" id="board"></ul>
            <button class="mc-btn small" onclick="show('home')">HOME</button>
        </div>

    </div>

    <script>
        const CSRF = "{{ csrf_token }}";
        const MAX = 5;          // hearts
        const STEP = 20;        // pixels he is lowered per wrong guess

        const stage = document.getElementById('stage');
        const person = document.getElementById('person');
        const bubble = document.getElementById('bubble');
        const shredder = document.getElementById('shredder');
        const banner = document.getElementById('banner');
        const heartsEl = document.getElementById('hearts');

        let state = { gameId: null, lives: MAX, over: false, busy: false, lo: 1, hi: 100 };
        let timers = [];

        const SAY = {
            name: "Hello, stranger! What is your name?",
            home: "HELP! Press START and save me!",
            play: "Guess my number to save me! 1 to 100!",
            leaderboard: "These heroes saved me before!",
        };
        const PLEAS = {
            4: "Phew... try again!",
            3: "Careful! That shredder looks hungry...",
            2: "Please think harder!!",
            1: "LAST CHANCE! PLEASE!!!",
        };

        const rand = (a, b) => Math.random() * (b - a) + a;
        const pick = arr => arr[Math.floor(Math.random() * arr.length)];
        const later = (ms, fn) => timers.push(setTimeout(fn, ms));
        const retrigger = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
        const cx = () => stage.clientWidth / 2;

        /* ---------- Minecraft hearts (pixel art drawn with SVG rects) ---------- */
        const HEART = [
            ".OOO.OOO.",
            "OWWRORRRO",
            "OWRRRRRRO",
            "ORRRRRRRO",
            "ORRRRRRDO",
            ".ORRRRDO.",
            "..ORRDO..",
            "...ORO...",
            "....O....",
        ];
        function heartSVG(full) {
            const c = full
                ? { O: '#1a0000', R: '#e8222b', W: '#ff9fa0', D: '#a80f16' }
                : { O: '#000', R: '#3b3b3b', W: '#4d4d4d', D: '#2d2d2d' };
            let rects = '';
            HEART.forEach((row, y) => [...row].forEach((ch, x) => {
                if (ch !== '.') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c[ch]}"/>`;
            }));
            return `<svg viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
        }
        function renderHearts(lives, lostIdx = -1) {
            heartsEl.innerHTML = '';
            for (let i = 0; i < MAX; i++) {
                const d = document.createElement('div');
                d.className = 'heart' + (i === lostIdx ? ' pop' : '');
                d.innerHTML = heartSVG(i < lives || i === lostIdx);   // the lost heart flashes red first
                heartsEl.appendChild(d);
            }
            if (lostIdx >= 0) later(450, () => renderHearts(state.lives));
        }

        /* ---------- he is "made of numbers" ---------- */
        function fillNums() {
            const chars = '0123456789+-=×÷%';
            document.querySelectorAll('.num').forEach(el => {
                let s = '';
                for (let i = 0; i < 70; i++) s += chars[Math.floor(Math.random() * chars.length)];
                el.textContent = s;
            });
        }

        /* ---------- numbers and symbols popping out ---------- */
        const SYMBOLS = Array.from('0123456789+-×÷=%#@$&*∑π√∞<>?!');
        const COLORS = ['#ffe94d', '#4cff7a', '#4cc3ff', '#ff5a5a', '#ffffff', '#ff9ed8'];
        function burst(x, y, n) {
            for (let i = 0; i < n; i++) {
                const el = document.createElement('span');
                el.className = 'bit';
                el.textContent = pick(SYMBOLS);
                el.style.left = (x + rand(-24, 24)) + 'px';
                el.style.top = y + 'px';
                el.style.color = pick(COLORS);
                el.style.fontSize = rand(10, 22) + 'px';
                el.style.setProperty('--dx', rand(-240, 240) + 'px');
                el.style.setProperty('--dy', rand(-280, -90) + 'px');
                el.style.setProperty('--rot', rand(-540, 540) + 'deg');
                el.style.setProperty('--dur', rand(900, 1700) + 'ms');
                el.addEventListener('animationend', () => el.remove());
                stage.appendChild(el);
            }
        }

        /* ---------- stage helpers ---------- */
        function say(text) {
            if (!text) { bubble.classList.add('hidden'); return; }
            bubble.classList.remove('hidden');
            bubble.textContent = text;
            retrigger(bubble, 'pop');
        }
        function setMood(m) { person.className = 'person ' + m; }
        const moodFor = l => (l >= 4 ? 'calm' : l >= 2 ? 'worried' : 'panic');
        const dropFor = l => (MAX - l) * STEP;

        function resetStage() {
            timers.forEach(clearTimeout); timers = [];
            stage.classList.add('reset');                     // no animation while resetting
            stage.classList.remove('danger', 'falling');
            stage.style.setProperty('--drop', '0px');
            setMood('calm');
            shredder.classList.remove('run');
            banner.className = 'banner';
            stage.querySelectorAll('.bit').forEach(b => b.remove());
            bubble.classList.remove('hidden');
            renderHearts(MAX);
            void stage.offsetWidth;
            stage.classList.remove('reset');
        }

        function showBanner(title, sub, kind) {
            document.getElementById('b-title').textContent = title;
            document.getElementById('b-sub').textContent = sub;
            banner.className = 'banner show ' + kind;
        }

        /* ---------- screens ---------- */
        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
            if (id !== 'play') resetStage();
            say(SAY[id]);
            if (id === 'name') document.getElementById('name-input').focus();
        }

        async function post(url, data = {}) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
                    body: JSON.stringify(data),
                });
                return await res.json();
            } catch (e) {
                return { error: 'Something went wrong. Try again.' };
            }
        }

        function setPlayer(name) {
            document.getElementById('player-name').textContent = name;
            document.querySelectorAll('.pname').forEach(el => el.textContent = name);
        }

        async function init() {
            fillNums();
            renderHearts(MAX);
            const res = await fetch('/api/me/');
            const data = await res.json();
            if (data.name) { setPlayer(data.name); show('home'); } else { show('name'); }
        }

        async function saveName() {
            const input = document.getElementById('name-input');
            const err = document.getElementById('name-error');
            const data = await post('/api/name/', { name: input.value });
            if (data.error) { err.textContent = data.error; return; }
            err.textContent = '';
            setPlayer(data.name);
            show('home');
        }

        /* ---------- the game ---------- */
        async function startGame() {
            const data = await post('/api/new/');
            if (data.error) { show('name'); return; }
            state = { gameId: data.game_id, lives: data.lives, over: false, busy: false, lo: 1, hi: 100 };
            show('play');
            resetStage();
            say(SAY.play);
            document.getElementById('attempts').textContent = 0;
            document.getElementById('message').textContent = '';
            document.getElementById('range').textContent = 'The number is between 1 and 100';
            document.getElementById('guess').value = '';
            document.getElementById('guess-form').style.display = 'block';
            document.getElementById('end-buttons').style.display = 'none';
            document.getElementById('guess').focus();
        }

        async function submitGuess() {
            if (state.over || state.busy) return;
            const input = document.getElementById('guess');
            const msg = document.getElementById('message');
            const val = input.value.trim();
            if (!val) return;

            state.busy = true;
            const data = await post(`/api/guess/${state.gameId}/`, { guess: val });
            state.busy = false;

            if (data.error) { msg.textContent = data.error; return; }
            document.getElementById('attempts').textContent = data.attempts;
            const guess = Number(val);

            if (data.result === 'correct') { win(data.attempts); return; }

            // wrong guess (or the last one)
            if (data.hint === 'higher') state.lo = Math.max(state.lo, guess + 1);
            else state.hi = Math.min(state.hi, guess - 1);
            document.getElementById('range').textContent = `The number is between ${state.lo} and ${state.hi}`;
            msg.textContent = data.hint === 'higher' ? 'Too low! Try a higher number.' : 'Too high! Try a lower number.';

            state.lives = data.lives;
            stage.style.setProperty('--drop', dropFor(state.lives) + 'px');   // lower him!
            renderHearts(state.lives, state.lives);                           // pop the lost heart
            retrigger(stage, 'hit');
            input.value = '';
            input.focus();

            if (data.result === 'lost') { lose(data.secret); return; }

            setMood(moodFor(state.lives));
            stage.classList.toggle('danger', state.lives <= 2);
            say((data.hint === 'higher' ? 'Try HIGHER! ' : 'Try LOWER! ') + PLEAS[state.lives]);
        }

        function endUI() {
            document.getElementById('guess-form').style.display = 'none';
            document.getElementById('end-buttons').style.display = 'block';
            document.getElementById('range').textContent = '';
        }

        function win(attempts) {
            state.over = true;
            endUI();
            const name = document.querySelector('.pname').textContent;
            document.getElementById('message').textContent = `Correct, ${name}! You saved him!`;
            stage.classList.remove('danger');
            stage.style.setProperty('--drop', '0px');       // rope pulls him up to safety
            setMood('happy');
            say('YOU SAVED ME!!! THANK YOU!!!');
            burst(cx(), 120, 30);
            later(350, () => burst(cx(), 120, 30));
            later(700, () => showBanner('YOU SAVED HIM!', `in ${attempts} guess${attempts === 1 ? '' : 'es'}`, 'win'));
        }

        function lose(secret) {
            state.over = true;
            endUI();
            document.getElementById('message').textContent = `He is gone... the number was ${secret}.`;
            setMood('panic');
            stage.classList.add('danger');
            say('NO NO NO... NOOOOO!');

            later(1000, () => {                              // rope snaps, he falls in
                bubble.classList.add('hidden');
                stage.classList.add('falling');
                stage.style.setProperty('--drop', '270px');
                shredder.classList.add('run');
            });
            for (let k = 0; k < 18; k++) {                    // he bursts into numbers and symbols
                later(1450 + k * 100, () => burst(cx(), 298, 6));
            }
            later(3500, () => {
                shredder.classList.remove('run');
                showBanner('GAME OVER', `The number was ${secret}`, 'lose');
            });
        }

        /* ---------- leaderboard ---------- */
        async function showLeaderboard() {
            const res = await fetch('/api/leaderboard/');
            const data = await res.json();
            const list = document.getElementById('board');
            list.innerHTML = '';
            if (!data.games.length) {
                const li = document.createElement('li');
                li.textContent = 'Nobody has saved him yet...';
                list.appendChild(li);
            }
            data.games.forEach((g, i) => {
                const li = document.createElement('li');
                const rank = document.createElement('span');
                const nm = document.createElement('span');
                const score = document.createElement('span');
                rank.className = 'rank'; rank.textContent = ['🥇', '🥈', '🥉'][i] || '#' + (i + 1);
                nm.className = 'nm'; nm.textContent = g.player;          // textContent = safe from HTML injection
                score.textContent = g.attempts + (g.attempts === 1 ? ' guess' : ' guesses');
                li.append(rank, nm, score);
                list.appendChild(li);
            });
            show('leaderboard');
        }

        document.getElementById('guess').addEventListener('keydown', e => { if (e.key === 'Enter') submitGuess(); });
        document.getElementById('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveName(); });

        init();
    </script>
</body>

</html>
